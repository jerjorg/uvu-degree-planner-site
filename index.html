<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UVU Degree Planner</title>
<!-- The university's design language, from style_guide/: tokens first, then
     components, then this page's own rules, in that order. The components
     file is copied by the build without its web-font import, because the
     planner makes no third-party request (INV-30); whether and how to load
     the fonts is a decision recorded in docs/CONTINUE.md. -->
<link rel="stylesheet" href="./uvu-tokens.css">
<link rel="stylesheet" href="./uvu.css">
<style>
/* ---------- roles over the university's tokens ----------
   The page speaks in roles (ground, surface, accent, warn, crit) and the
   roles are the university's colours. Nothing below names a hex value. */
:root{
  --ground:var(--uvu-gray-xlight); --surface:var(--uvu-white); --sunk:var(--uvu-surface);
  --line:var(--uvu-gray); --line-soft:var(--uvu-surface-alt);
  --ink:var(--uvu-ink); --ink-2:var(--uvu-ink); --ink-3:var(--uvu-ink-muted);
  --accent:var(--uvu-green); --accent-soft:var(--uvu-success-bg);
  --warn:var(--uvu-warning); --warn-soft:var(--uvu-warning-bg); --warn-line:var(--orange-3);
  --crit:var(--uvu-danger); --crit-soft:var(--uvu-danger-bg); --crit-line:var(--red-3);
  /* something to confirm: a caution, apart from the orange a heavy term carries */
  --caution:var(--gold-5); --caution-soft:var(--gold-2); --caution-line:var(--gold-3);
  /* the parts of a degree, in the order the program's requirement list gives them */
  --cat-0:var(--uvu-green); --cat-1:var(--blue-6); --cat-2:var(--purple-5); --cat-3:var(--teal-6);
  --cat-4:var(--gold-6); --cat-5:var(--red-6); --cat-6:var(--yellow-7); --cat-7:var(--orange-6);
  color-scheme:light;
}
/* The `hidden` attribute has to win over a class that sets display, or a
   section switched off by script stays on the page. */
[hidden]{display:none!important}
body{background:var(--ground)}
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(15px,3vw,30px)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--space-5) 0 var(--space-4)}
.brandmark{display:flex;align-items:baseline;gap:11px}
.brandmark .rule{width:26px;height:3px;background:var(--accent);transform:translateY(-6px);flex:none}
header.top h1{margin:0;font-size:var(--text-h2);line-height:1.12}
header.top .sub{color:var(--ink-3);font-size:15px;line-height:1.5;margin:var(--space-2) 0 0;max-width:96ch}
/* ---------- controls: the bar that stays at the top ----------
   Three fields of one height on one baseline, the plan's three figures at
   the right, and the way back up beside them. */
.controls{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 18px;align-items:start;margin:0;padding:12px 16px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
  border-bottom:1px solid var(--line);background:var(--surface)}
.controls select,.combo-input{height:36px;font-size:var(--text-small);border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
.controls select{width:auto;max-width:44ch;padding:0 30px 0 10px}
.controls select:hover,.combo-input:hover{border-color:var(--ink-3)}
.combo{position:relative;min-width:0}
.year-control{grid-column:span 2}
.program-control{grid-column:span 3}
.minor-control{grid-column:span 3}
.suggest-control{grid-column:span 4;min-width:0}
.suggest-control .checks{padding:0;border:0;background:transparent;font-size:var(--text-small)}
.suggest-control .checks.minor>summary{padding:0 0 2px;min-height:18px}
.suggest-control .checks h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.suggest-control .checks.minor .minor-body{margin-top:6px;max-height:min(360px,45vh);overflow-y:auto;padding-right:6px}
.suggest-control .checks.minor .minor-list{margin:0;padding:0;list-style:none}
.suggest-control .checks.minor .minor-list li{margin:0 0 10px;padding:0}
.suggest-control .checks.minor .minor-list li::before{content:none}
.suggest-control .checks .muted{margin:4px 0 0;font-size:var(--text-caption)}
.suggest-control .problem-message{font-size:13px}
.suggest-control .minor-list strong{font-weight:600}
.suggest-control .problem-remedy{font-size:12px}
.pace-control{grid-column:span 7}
.start-control{grid-column:span 2}
.controls .qb-stats,.controls .leave{grid-column:span 3;justify-self:end}
@media (max-width:980px){.controls{display:flex;flex-wrap:wrap}.combo{flex:1 1 280px}}
.combo-input{width:100%;max-width:none;padding:0 10px}
.combo-panel{position:absolute;z-index:45;left:0;top:100%;margin:4px 0 0;width:max(100%,min(720px,calc(100vw - 40px)));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 22px rgba(0,0,0,.12);
  display:flex;flex-direction:column}
.combo-filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:10px 10px 9px;
  border-bottom:1px solid var(--line-soft);background:var(--ground)}
.combo-filters:empty{display:none}
.combo-filter{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;min-width:0}
.combo-filter-label{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.combo-filter select{width:100%;max-width:none;height:32px;font-size:var(--text-caption);padding:0 26px 0 8px}
.combo-clear{align-self:flex-end;height:32px;padding:0 10px;font-family:var(--font-heading);font-size:12px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:transparent;border:1px solid var(--accent);
  border-radius:var(--radius-sm);cursor:pointer}
.combo-clear:hover{background:var(--accent);color:var(--uvu-white)}
.combo-list{margin:0;padding:4px;list-style:none;max-height:min(360px,55vh);overflow:auto}
.combo-option{display:flex;align-items:baseline;gap:8px;padding:6px 9px;font-size:var(--text-small);cursor:pointer;border-radius:2px;margin:0}
.combo-option.active,.combo-option:hover{background:var(--accent-soft);color:var(--accent)}
.combo-option[aria-selected=true] .combo-name{font-weight:700}
.combo-option.member{padding-left:20px}
.combo-onfile,.pgm-sib small.onfile{font-family:var(--font-heading);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--uvu-green-1);border-radius:2px;padding:1px 5px;white-space:nowrap;line-height:1.3}
.combo-option.active .combo-onfile,.combo-option:hover .combo-onfile{background:var(--surface)}
.combo-group{margin:4px 0 0;padding:6px 9px 2px;font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.combo-group:first-child{margin-top:0}
.combo-none{padding:6px 9px;color:var(--ink-3);font-size:var(--text-caption);margin:0}
/* the list reads as the catalog is organized: college, department, degree */
.combo-college{margin:6px 0 0;padding:8px 9px 3px;font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);border-top:1px solid var(--line-soft)}
.combo-college:first-child{margin-top:0;border-top:0}
.combo-dept{padding:5px 9px 2px;font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.combo-chosen{display:block;font-size:var(--text-caption);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.combo-chosen-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;max-width:100%;align-self:flex-start}
.combo-chosen-row{max-width:100%}
.combo-add{align-self:flex-start;margin-top:4px;padding:2px 0;border:0;background:transparent;font:inherit;font-size:var(--text-caption);font-weight:700;color:var(--accent);cursor:pointer}
.combo-add:hover{text-decoration:underline}
.combo-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.program-control .combo-chips{flex-direction:column;align-items:flex-start}
.chip-line{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%}
.combo-chips:empty{display:none}
.combo-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 4px 2px 9px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);font-size:var(--text-caption);color:var(--ink)}
.combo-chip-x{flex:none;width:16px;height:16px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer}
.combo-chip-x:hover{background:var(--crit);color:var(--uvu-white)}
.empty-program{margin:var(--space-6) auto;max-width:56ch;padding:36px 32px 32px;text-align:center;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--radius-sm)}
.empty-program .eyebrow-label{margin:0 0 6px}
.empty-program h2{margin:0 0 10px;font-size:var(--text-h3);line-height:1.2}
.empty-program p:not(.eyebrow-label){margin:0 auto 18px;font-size:15px;color:var(--ink-2);line-height:1.55;max-width:48ch}
.checks .remove-major{margin:-4px 0 8px;padding:3px 8px;font-size:var(--text-caption)}
/* the plan in three figures, and the way back up */
.qb-top{align-self:flex-end;height:36px;padding:0 12px;font-family:var(--font-heading);font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer}
.qb-top:hover{border-color:var(--accent);background:var(--accent-soft)}
/* what the catalog's list says about the program, under its name */
.pgm-facts{margin:6px 0 0;font-size:var(--text-small);color:var(--ink-3)}
.pgm-facts .cat-link{margin:0}
.pgm-notice{margin:10px 0 0;padding:9px 12px;border-left:4px solid var(--warn-line);background:var(--warn-soft);font-size:var(--text-small);line-height:1.45;color:var(--ink-2);border-radius:var(--radius-sm)}
.pgm-family{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0 0}
.pgm-family-label{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.pgm-sib{display:inline-flex;align-items:baseline;gap:5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer}
/* the tracks: a choice the requirement table asks for, set apart with its own line */
.pgm-sib:hover{border-color:var(--accent);color:var(--accent)}
.pgm-sib.current{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:default}
.pgm-sib small{font-size:10px;color:var(--ink-3)}
.pgm-emph{margin:10px 0 0}
.pgm-emph-list{margin:0;padding-left:18px;font-size:var(--text-small);line-height:1.5;columns:2;column-gap:var(--space-5)}
.pgm-emph-list li{break-inside:avoid}
.pgm-emph-list b{font-family:var(--font-mono);font-weight:600}
@media (max-width:700px){.pgm-emph-list{columns:1}}
.control{display:flex;flex-direction:column;gap:4px;min-width:0}
.control-label,.eyebrow-label{font-family:var(--font-heading);font-size:11.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);line-height:1.2}
.control{gap:6px}
/* ---------- the pace: a load, and the length that follows ----------
   A slider from one credit a term to twenty, the figure beside it, the
   flat-rate band under it, and under that what the plan came to. */
.pace-control{min-width:0}
.pace-row{display:flex;align-items:flex-start;gap:10px}
.pace-track{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:center;height:36px}
.pace-track{--flat-rate:color-mix(in srgb,var(--accent) 38%,#fff)}
.pace-track input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer}
.pace-track input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) 0 var(--pace-value,0%),transparent var(--pace-value,0%)),var(--pace-track,var(--line))}
.pace-track input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) 0 var(--pace-value,0%),transparent var(--pace-value,0%)),var(--pace-track,var(--line))}
.pace-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.pace-track input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.pace-track input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:9px}
.cost-head{margin:var(--space-4) 0 var(--space-2)}
.cost-head:first-child{margin-top:0}
.pace-note{margin:2px 0 0;font-size:var(--text-caption);color:var(--ink-3)}
.pace-figure{flex:none;min-width:11.5ch;font-family:var(--font-heading);font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
.pace-figure small{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pace-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-left:16px;padding-top:6px;font-size:var(--text-small);color:var(--ink)}
.pace-opts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.pace-opts input{margin:0;width:17px;height:17px;accent-color:var(--accent)}
/* what the plan carries for a minor or a second major, and the whole requirement table */
.pgm-additions{margin:6px 0 0;max-width:78ch}
.pgm-additions>summary{padding:8px 2px;font-size:var(--text-caption)}
.pgm-additions .fold-body{max-height:min(320px,40vh);overflow-y:auto}
/* the programs the record is closest to finishing: the page's own type, ten of each kind in a box that scrolls */
.about-side .closest{grid-column:1/-1;display:block;border-top:1px solid var(--line-soft)}
.closest-head{flex:none;display:flex;align-items:center;gap:8px;padding:11px 2px;font-family:var(--font-heading);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.closest-body{padding:4px 0 6px;font-family:var(--font-body)}
.closest-body p.eyebrow-label.closest-kind{margin:18px 0 6px}
.closest-body p.eyebrow-label.closest-kind:first-child{margin-top:4px}
.closest-list{list-style:none;margin:0 0 6px;padding:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.closest-list li{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;padding:5px 8px 5px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--font-body);font-size:var(--text-small);line-height:1.35}
.closest-list li:last-child{border-bottom:0}
.closest-list li::before{content:none}
.closest-list b{font-size:13px;font-weight:600;color:var(--ink)}
.closest-need{grid-column:1;font-size:var(--text-caption);color:var(--ink-3)}
.closest-list .btn{grid-column:2;grid-row:1/span 2}
.added-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.added-list li{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:var(--text-small)}
.added-list li::before{content:none}
.added-list b{font-family:var(--font-mono);font-weight:600}
.added-list li.choice b{font-family:var(--font-heading);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.added-list small{color:var(--ink-3);font-size:var(--text-caption)}
.fold-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);align-items:start;margin:var(--space-2) 0 var(--space-3)}
@media (max-width:760px){.fold-row{grid-template-columns:minmax(0,1fr)}}
.all-reqs,.all-courses{margin:var(--space-3) 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0}
.all-reqs>summary,.all-courses>summary{padding:12px var(--space-4);font-family:var(--font-heading);font-weight:600;font-size:15px;color:var(--accent)}
.all-courses .fold-body{max-width:none;max-height:none;overflow:visible;padding:2px var(--space-4) 14px;color:var(--ink)}
.all-reqs .fold-body{max-height:min(560px,60vh);overflow-y:auto;padding:2px var(--space-4) 14px;color:var(--ink)}
.req-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.req-list li::before{content:none}
.req-list .req-block{margin:0 0 6px}
.req-list .req-block>.req-list{padding-left:14px;border-left:2px solid var(--line-soft)}
.req-head{margin:8px 0 2px;font-family:var(--font-heading);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.req{display:flex;align-items:baseline;gap:8px;margin:0;font-size:var(--text-small);line-height:1.45}
.req-mark{flex:none;width:16px;font-style:normal;font-weight:700;text-align:center}
.req.met .req-mark{color:var(--accent)} .req.unmet .req-mark{color:var(--crit)} .req.unverifiable .req-mark{color:var(--warn)}
.req-text b{font-family:var(--font-mono);font-weight:600}
.req-text small{color:var(--ink-3);font-size:var(--text-caption)}
.req-text em{display:inline-block;margin-left:6px;font-style:normal;font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.req.met .req-text em{color:var(--accent)} .req.unmet .req-text em{color:var(--crit)} .req.unverifiable .req-text em{color:var(--warn)}
.control select{width:auto;max-width:44ch;padding:7px 10px;font-size:15px}
.year-control select{max-width:18ch}
/* ---------- the information mark beside a label ----------
   A circled i. Hover or focus shows what the label means, a click or a tap
   holds it open, and Escape or a press elsewhere closes it. The text is the
   field's description too, for a screen reader. The mark takes no more
   height than the label, so a label with one lines up with one without. */
.control-head{display:flex;align-items:center;gap:5px;min-width:0}
.info{position:relative;display:inline-flex;align-items:center;flex:none}
.info-btn{width:14px;height:14px;margin:-1px 0;padding:0;border:1.25px solid var(--ink-3);border-radius:50%;
  background:var(--surface);color:var(--ink-3);font-family:var(--font-body);font-size:9.5px;font-weight:700;
  line-height:1;letter-spacing:0;text-transform:none;display:grid;place-items:center;cursor:pointer}
.info-btn:hover,.info-btn:focus-visible{border-color:var(--accent);color:var(--accent)}
.info-btn[aria-expanded=true]{border-color:var(--accent);background:var(--accent);color:var(--uvu-white)}
.info-pop{position:absolute;z-index:50;left:0;top:calc(100% + 7px);width:min(320px,calc(100vw - 24px));
  padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius-sm);box-shadow:0 8px 22px rgba(0,0,0,.12);font-family:var(--font-body);
  font-size:var(--text-caption);font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2);
  line-height:1.45;text-align:left;white-space:normal;cursor:auto}
/* the gap between the mark and its text belongs to the text, so the pointer can cross it */
.info-pop::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.info-pop.above{top:auto;bottom:calc(100% + 7px)}
.info-pop.above::before{top:auto;bottom:-8px}
.controls .leave{align-self:flex-end}
.pgm-unnamed{max-width:78ch;line-height:1.45}
.track-pick{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-caption);color:var(--ink-3)}
.track-pick select{height:26px;padding:0 4px;font-size:var(--text-caption);max-width:240px}
/* ---------- what the student says about themselves ---------- */
.about{background:var(--surface);border-bottom:1px solid var(--line)}
.about-head{margin:0;padding:var(--space-3) 0;font-family:var(--font-heading);font-weight:600;font-size:19px;
  color:var(--accent)}
.about-body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-5) var(--space-10);padding:var(--space-1) 0 var(--space-6)}
@media (max-width:900px){.about-body{grid-template-columns:1fr}}
.about-side{display:flex;flex-direction:column;gap:var(--space-4)}
.about-side .about-row,.about-side .about-field{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3) var(--space-4)}
.about-side .control select{width:100%;max-width:none}
.confirm-row{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;align-self:flex-start;padding:8px 10px;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--text-caption);color:var(--ink)}
.confirm-row .btn.danger{background:var(--crit);border-color:var(--crit);color:var(--uvu-white)}

/* An item is a box. The button inside it opens the drawer; the × beside it

   does not say, and its three dots are the sign the card can be picked up. */
.item{position:relative;display:flex;align-items:flex-start;border:1px solid var(--line-soft);border-radius:var(--radius-sm);

.blk h3 .blk-tag.warn{background:var(--warn-soft);color:var(--warn)}

/* when the sections have met: bars, as the prototype drew them (FR-DATA-27) */
.whenbox{display:flex;flex-direction:column;gap:12px}
.wrow{display:flex;flex-direction:column;gap:5px}
.wlab{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.wbars{display:flex;gap:5px;align-items:flex-end}
.wcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wcell i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0}
.wcell.zero i{background:var(--line)}
.wcell b{font-size:9.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.wcell.zero b{color:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lib-slots{padding:0 var(--space-4) 4px}
.lib-fold>summary{padding:8px 2px;font-size:var(--text-caption)}
.lib-fold-body{max-height:min(240px,32vh);overflow-y:auto;padding:0 2px 10px 18px}
.lib-slot-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lib-slot{font:inherit;font-size:11.5px;padding:4px 9px;border:1px dashed var(--ink-3);border-radius:999px;
  background:var(--surface);color:var(--ink-2);cursor:pointer}

.dr-move select{width:auto;padding:5px 8px;font-size:var(--text-small)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg-btn{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 11px;

/* ---------- swapping, in the drawer ---------- */
.alt-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-soft)}

/* ---------- course library ---------- */
.library{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);z-index:55;

.lib-head{position:relative;display:flex;flex-direction:column;gap:11px;padding:var(--space-4) 50px var(--space-3) var(--space-4);
  }

  color:var(--ink-3);margin:0}

.lib-aim select{width:auto;padding:6px 9px;font-size:var(--text-small)}

.lib-hint{margin:0;font-size:var(--text-caption);color:var(--ink-3);line-height:1.45;max-width:none}
.lib-count{margin:0;font-size:12.5px;color:var(--ink-3);padding:6px var(--space-4) 8px;line-height:1.45}
/* what was just added, and the quiet way back */
.lib-status{margin:0;padding:8px var(--space-4) 2px;font-size:var(--text-caption);color:var(--ink-2);line-height:1.45}
.lib-status .lib-undo{margin-left:6px;padding:0 2px;height:auto;border:0;background:none;font:inherit;font-size:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}

/* the library's list fills the panel and scrolls as one */
.lib-list{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 var(--space-4) var(--space-3)}
.lib-list .clist-box{flex:1;min-height:0;max-height:none}

.lib-list .clist-face:active{cursor:grabbing}
.pill .pill-twice{font-style:normal;color:var(--accent);font-weight:700}

/* ---------- one list for every long list of courses ----------
   A search box where the list is long, a scrolling box of rows with the
   actions in a column of their own, and a fold for the rest. */
.clist{display:flex;flex-direction:column;gap:8px;min-width:0}
.clist-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.clist-search{flex:1;min-width:160px;max-width:none;padding:8px 11px;font-size:var(--text-small)}
.clist-count{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.clist-box.more-below{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),rgba(0,0,0,.25));mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),rgba(0,0,0,.25))}
.clist-box{max-height:min(420px,50vh);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);scrollbar-width:thin}
.clist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 12px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.clist-row:last-child{border-bottom:0}
.clist-row.muted .clist-face{opacity:.55}
.clist-face{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:4px 10px;min-width:0;font:inherit;text-align:left;
  color:inherit;background:transparent;border:0;padding:0;border-radius:var(--radius-sm)}
button.clist-face{cursor:pointer;margin:-4px -6px;padding:4px 6px}
button.clist-face:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.clist-row:has(button.clist-face:hover){background:var(--accent-soft)}
.clist-row:has(button.clist-face:hover) .clist-code{color:var(--uvu-green-7)}
.clist-code{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.clist-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.clist-title{font-size:var(--text-small);color:var(--ink);line-height:1.35}
.clist-note{font-size:var(--text-caption);color:var(--ink-3);line-height:1.35}
.clist-detail{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.clist-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.clist-tag{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);background:var(--sunk);white-space:nowrap}
.clist-tag.ok{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.clist-tag.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.clist-tag.crit{color:var(--crit);border-color:var(--crit-line);background:var(--crit-soft)}
.clist-acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.clist-act{font:inherit;font-family:var(--font-heading);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:5px 11px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;border-radius:var(--radius-sm);min-width:76px}
.clist-act:hover,.clist-act:focus-visible{background:var(--accent);color:var(--uvu-white)}
.clist-act.primary{background:var(--accent);color:var(--uvu-white)}
.clist-act.primary:hover{background:var(--uvu-green-7);border-color:var(--uvu-green-7)}
.clist-act[aria-expanded=true]{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.clist-panel{grid-column:1/-1;margin:2px 0 4px;padding:9px 12px;background:var(--sunk);border-left:3px solid var(--line);font-size:var(--text-caption);color:var(--ink)}
.clist-panel p{margin:0 0 4px;max-width:none}
.clist-panel ul{margin:2px 0 6px;padding-left:16px}
.clist-panel li{margin:0}
.clist-panel li.error{color:var(--crit)} .clist-panel li.warning{color:var(--warn)}
.clist-group{margin:0;padding:10px 12px 4px;font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  background:var(--ground);border-bottom:1px solid var(--line-soft)}
.clist-empty{margin:0;padding:12px;font-size:var(--text-caption);color:var(--ink-3)}
.clist-foot:empty{display:none}
.clist-more{font:inherit;font-family:var(--font-heading);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 12px;border:1px dashed var(--line);background:var(--surface);color:var(--accent);cursor:pointer;border-radius:var(--radius-sm);align-self:flex-start}
.clist-more:hover{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:520px){.clist-row{grid-template-columns:1fr}.clist-tags,.clist-acts{justify-content:flex-start}}
/* ---------- print: one readable page (FR-ADV-01) ----------
   The plan, its numbers and its provenance. Controls, drawers and the library
   are for a screen; the lists print only if the reader opened them. */
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff;font-size:11px}
  .controls,.about,.editbar,.sharebar,.library,.drawer,.scrim,.skip-link,
  .item-x,.chip-x,.item-chk,.chip-chk,.term-foot,.term-act,.addbtn,.term.new-term,.trow.new-term,.transcript,.info{display:none!important}
  header.top{border:0;padding:0}
  header.top p{display:none}
  .output{padding:0}
  .summary{grid-template-columns:1fr}
  .stats{margin:6px 0}
  .stat{padding:4px 8px} .stat .k{font-size:8px} .stat .v{font-size:13px} .stat .u{font-size:8px}
  .vbar,.legend .lg.note,.brandmark .rule{display:none!important}
  .gridwrap{overflow:visible;padding:8px 0}
  .terms{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:row;gap:6px;overflow:visible;padding:8px 0}
  .term{break-inside:avoid;border-radius:0}
  .item-open{padding:3px 6px 2px} .item-name{font-size:10.5px} .item-title{font-size:9.5px}
  .item-dot{display:none}
  .ttable{font-size:10px} .ttable th,.ttable td{padding:3px 6px}
  .problems{margin:8px 0 0} .problems h3{font-size:14px}
  .alert,.notes{break-inside:avoid}
  a[href]::after{content:""}
}

<body>
<a class="skip-link" href="#app">Skip to the plan</a>
<header class="top">
  <div class="wrap">
    <div class="brandmark"><span class="rule" aria-hidden="true"></span><h1>UVU Degree Planner</h1></div>
    <p class="sub">Lay out your degree term by term around what you've already passed, then take the plan
       to your academic advisor before you register.</p>
  </div>
</header>
<main class="wrap" id="app"></main>
<noscript><p class="wrap">The planner needs JavaScript. The plan your department publishes is
  <a href="./fallback/computer-science-bs.html">here as a plain page</a>.</p></noscript>
<script>
// FR-PLAN-13. If the planner's script fails to load, or has not started a few
// seconds after the page did, show the department's published plan as
// prebuilt, say plainly that editing and personalization are unavailable, and
// point to advising. This is a classic script on purpose: it has to run in a
// browser the module below cannot.
(function () {
  var shown = false;
  function stem() {
    try {
      var stored = JSON.parse(window.localStorage.getItem("uvu-planner.context.v1") || "{}");
      if (typeof stored.programFile === "string" && /^[a-z0-9-]+\.json$/.test(stored.programFile)) {
        return stored.programFile.replace(/\.json$/, "");
      }
    } catch (e) { /* no stored choice */ }
    return "computer-science-bs";
  }
  function show(why) {
    if (shown || window.plannerStarted) return;
    shown = true;
    var app = document.getElementById("app");
    if (!app) return;
    var href = "./fallback/" + stem() + ".html";
    app.innerHTML = "";
    var note = document.createElement("p");
    note.className = "alert alert-warning";
    note.textContent = "The planner did not start (" + why + "). Showing the plan your department publishes instead; " +
      "it cannot be edited or fitted to what you have already done here, and your department's academic advisor can do both.";
    var link = document.createElement("a");
    link.href = href;
    link.textContent = "Open the published plan as a plain page";
    var frame = document.createElement("iframe");
    frame.src = href;
    frame.title = "The published plan";
    frame.style.cssText = "width:100%;height:80vh;border:1px solid var(--uvu-gray, #e8e8e8);background:#fff";
    app.appendChild(note);
    app.appendChild(link);
    app.appendChild(frame);
  }
  window.addEventListener("error", function (event) {
    var target = event.target;
    if (target && target.tagName === "SCRIPT") show("its script could not be loaded");
    else if (!window.plannerStarted) show("its script stopped before it started");
  }, true);
  window.setTimeout(function () { show("it did not start within eight seconds"); }, 8000);
})();
</script>
